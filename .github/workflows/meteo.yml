name: Édition du matin

on:
  schedule:
    - cron: "45 2 * * *"   # 05 h 45 à Mayotte (UTC+3)
  workflow_dispatch: {}     # lancement manuel possible depuis l'onglet Actions

permissions:
  contents: write

jobs:
  edition-du-matin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Collecter la météo (Open-Meteo)
        run: python3 outils/maj_meteo.py

      - name: Collecter la revue de presse (titres + liens uniquement)
        run: python3 outils/maj_revue.py

      - name: Collecter les appels d'offres Mayotte (BOAMP, open data)
        run: python3 outils/maj_marches.py

      - name: Commiter et publier si changement
        run: |
          if git diff --quiet -- _data/; then
            echo "Rien de neuf, pas de publication."
            exit 0
          fi
          git config user.name "edition-bot"
          git config user.email "actions@users.noreply.github.com"
          git add _data/
          git commit -m "Édition du matin : météo et revue de presse"
          git push origin HEAD:main
          git push origin HEAD:gh-pages
